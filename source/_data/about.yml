# 自定义
cause:
  tip: 关于本站
  title: 为什么建站？
  content:
    <br><b>将所学记录，分享技术</b>。
    <br>技术如繁星之多，迭代如春笋涌出。而人的脑海无法储存这些大量的知识。所以需要一个平台来整理学习到的知识体系或者记录生活的琐事。
    <br><br><h1>本站的 TimeLine</h1>
    2020年10月01日，本站使用<b>Hexo</b>（主题：<b>Butterfly</b>），部署到 <b>Git Page </b>
    <br>2022年01月09日，整体迁移至 <b>VuePress</b> 部署到 <b>GitHub Pages </b>
    <br>2025年11月16日，整体迁回至 <b>Hexo</b>（主题：<b>Solitude</b>），托管至 <b>Vercel</b> 更换域名为：<a href="https://www.yichencv.top/"><b>yichencv.top</b></a>

