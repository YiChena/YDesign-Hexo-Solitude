# Google Adsense
# 谷歌广告
google_adsense:
  enable: false
  # Auto ads
  # 自动广告
  auto_ads: false
  # Page-level ads
  # 页面级广告
  enable_page_level_ads: true
  # Sidebar card ads
  # 侧边栏卡片广告
  aside_card: true
  # Post card ads
