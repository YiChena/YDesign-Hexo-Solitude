# --------------------------- start ---------------------------
# 网站信息
site:
  name:
    class: text # text / i_class / img
    custom: YDesign  # Solitude / fas fa-ghost / /img/pwa/favicon.ico
  icon: https://ydesign.oss-cn-beijing.aliyuncs.com/logoIco.ico # Site icon / 网站图标
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Navigation bar
# 导航栏
nav:
  # Left Box
  # 左侧盒子
  group:
   博客:  # name  
     YDesign: / || https://ydesign.oss-cn-beijing.aliyuncs.com/logo-003.png # name: url || icon
    #  YDesign-VuePress: / || https://ydesign.oss-cn-beijing.aliyuncs.com/logo-003.png # name: url || icon
   公众号:  # name
     YDesign: / || https://ydesign.oss-cn-beijing.aliyuncs.com/logo-003.png # name: url || icon
  # Menu
  # 菜单
  menu:
    # 首页: / # name: link
    文库: # name
      全部文章: /archives/ || fas fa-folder-closed # item name: link || icon
      文章分类: /categories/ || fas fa-clone
      标签列表: /tags/ || fas fa-tags
    友链:
      # 朋友圈: /moments/ || fas fa-wifi
      友人帐: /links/ || fas fa-user-group
      宝藏博主: javascript:travelling() || fas fa-gift
    我的:
      摄影: /gallery/ || fas fa-camera
      装备: /kit/ || fas fa-laptop
      音乐馆: /music/ || fas fa-music
    关于: /about/
    # 关于:
    #   关于本站: /about/ || fas fa-user
      
      

  # Right button
  # 右侧按钮
  right:
    random: true # Random article / 随机文章按钮
    # custom:
    #  - name: 开往 # 名字
    #    url: https://www.travellings.cn/go.html # 跳转链接
    #    icon: fas fa-train # 图标
    #    onclick:  # 点击事件
    #    id: travellings_button # id
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Home Top Banner
# 首页顶部
hometop:
  enable: true
  banner:
    title: 分享技术<br >与生活 # 大字
    desc:
      - 要主动去促进事情发生，不要坐等事情发生。 # 小字
      - 学如逆水行舟，不进则退。
      # - 业精于勤荒于嬉，行成于思毁于随。
    icon:
      HTML: # name
        img: https://i.postimg.cc/vBWVnY8q/html.png # url
        color: "#e9572b" # color
      JS:
        img: https://i.postimg.cc/3N10Ltv2/js.png
        color: "#f7cb4f"
      Docker:
        img: https://i.postimg.cc/8Pk6Fg24/docker.png
        color: "#57b6e6"
      Flutter:
        img: https://i.postimg.cc/hPC7T3gB/flutter.png
        color: "#ffffff"
      WebPack:
        img: https://i.postimg.cc/dVLZBmtT/webpack.png
        color: "#2e3a41"
      Git:
        img: https://i.postimg.cc/nhgjwjCS/git.png
        color: "#df5b40"
  group: # fa-chrome
    技术: /about/ || fab fa-github fa-pulse || linear-gradient(to right,#f65,#ffbf37)
    生活: /about/ || fas fa-bicycle || linear-gradient(to right,#61F3AC,#00CCBB)
  recommendList:
    enable: true
    sup: 导读
    title: 無限進步 # YDesign 导读
    url: /guide/
    img: https://ydesign.oss-cn-beijing.aliyuncs.com/HomePageImg.png
    color: "none"
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Aside
# 侧边栏
aside:
  Values: about (info card), newestPost (latest article), allInfo (website information), newest_comment (latest comment)
  # 值: about(信息卡), newestPost(最新文章), allInfo(网站信息), newest_comment(最新评论)

  # Sticky: Fixed position / noSticky: Not fixed position
  # Sticky: 固定位置 / noSticky: 不固定位置
  home: # on the homepage
    noSticky: "about"
    Sticky: "allInfo"
  post: # on the article page
    noSticky: "about"
    Sticky: "newestPost"
  page: # on the page
    noSticky: "about"
    Sticky: "newestPost,allInfo"
  # 菜单栏位置(0: 左 1: 右)
  position: 1 # Sidebar positioning(0: left 1: right)

  # --------------------------- start ---------------------------
  # Information card
  # 信息卡
  my_card:
    author:
      img: https://ydesign.oss-cn-beijing.aliyuncs.com/logo-002.png # url
      sticker: https://ydesign.oss-cn-beijing.aliyuncs.com/emoji-%E7%9C%A8%E7%9C%BC.gif #24x24 size
    # 介绍 / Introduction
    description: 悲观者永远正确，乐观者正在前行
    # 内容 / Content  
    content: 技术如繁星之多，迭代如春笋涌出。而人的脑海始终无法储存这些大量的知识。所以需要一个平台来整理学习到的知识体系或记录生活的琐事。
    state:
      morning: ✨ 早上好，新的一天开始了
      noon: 🍲 午餐时间
      afternoon: 🌞 下午好
      night: 早点休息
      goodnight: 晚安 😴
    witty_words:
      - 祝你好运 ~
      - 你一定可以的 
      - 你可以的 
    # social
    # 社交信息图标
    information:
     Github: https://github.com/YiChena || fab fa-github # Name: link || icon
     Bilibili: https://space.bilibili.com || fab fa-bilibili
  # --------------------------- end ---------------------------

  # --------------------------- start ---------------------------
  # article table of contents
  # 文章目录
  toc:
    post: true
    page: true
    vague: true
  # --------------------------- end ---------------------------

  # --------------------------- start ---------------------------
  # Tags
  # 标签
  tags:
    enable: true
    limit: 20 # Number of tags displayed
    # Highlighted tags
    highlight_list:
      # - Hexo
  # --------------------------- end ---------------------------

  # --------------------------- start ---------------------------
  # Site Info
  # 网站信息
  siteinfo:
    # Number of articles
    # 文章数量
    postcount: true
    # Total number of words
    # 总字数
    wordcount: true
    # PV
    pv: true
    # UV
    uv: true
    # Last update date
    # 最后更新日期
    updatetime: true
    # Website creation time
    # 网站创建时间
    runtimeenable: true
    # Format: yyyy-MM-dd hh-mm-ss
    # 格式: yyyy-MM-dd hh-mm-ss
    runtime: "2020-10-01 00:00:00"
  # --------------------------- end ---------------------------
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Page default settings
# 页面默认设置
page:
  # 404 page
  # 404 页面
  error: true
  # Tags page
  # 标签页面
  tags: true
  # Categories page
  # 分类页面
  categories: true
  # list: Sort List / 1: Follow HomeList
  # list: 排序列表 / 1: 跟随首页列表
  archives: 0
  # Default value
  # 默认值
  default:
    # Default image when no cover is set
    # 未设置封面时的默认图片
    cover: 
      - /img/default.png # 默认图片 / default cover
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Post default settings
# 文章默认设置
post:
  default:
    # Default image when no cover is set
    # 未设置封面时的默认图片
    cover:
      - https://ydesign.oss-cn-beijing.aliyuncs.com/HelloWorld.png # 默认图片 / default cover
    # Location
    # 位置
    locate: 长沙
    # Copyright
    # 版权
    copyright:
      enable: true
      author: https://ydesign.oss-cn-beijing.aliyuncs.com/logo.png
 # url
      # License
      # 许可证
      license: CC BY-NC-SA 4.0
      # License link
      # 许可证链接
      licenurl: https://creativecommons.org/licenses/by-nc-sa/4.0/deed.zh-hans
  # Article Local AI
  # 文章本地AI
  ai:
    enable: true
    modelName: 小七 GPT
  # Article meta information
  # 文章元信息
  meta:
    # Release date
    # 发布日期
    date: true
    # Update date
    # 更新日期
    updated: true
    # Location
    # 位置
    locate: true
    # Number of words
    # 字数
    wordcount: true
    # uv
    readtime: true
    # pv
    pv: true
    # Comment count
    # 评论数
    comment: true
  # Reward
  # 打赏
  award:
    enable: true
    appreciators: /about/ # Reward page
    # Reward Title
    # 打赏标题
    title: 感谢你赐予我前进的力量 # Thanks for your appreciation. / 感谢您的赞赏
    desc: 因为您的支持让我意识到写文章的价值😉 # Because of your support, I realize the value of writing articles. / 由于您的支持，我才能够实现写作的价值。
    # Reward list
    # 打赏列表
    list:
      - name: 支付宝
        qcode: https://s3.qjqq.cn/47/661ba900c4bc1.webp!color
        url: https://ydesign.oss-cn-beijing.aliyuncs.com/zfb.png
        color: var(--efu-black) 
      - name: 微信
        qcode: https://s3.qjqq.cn/47/661ba900c4bc1.webp!color
        url: https://ydesign.oss-cn-beijing.aliyuncs.com/wx.png
        color: var(--efu-black)
  # Share icon
  # 分享图标
  share:
    enable: true
    list:
      - qq
      - weibo
      # - twitter
      # - facebook
      # - telegram
      # - whatsapp
      # - linkedin
      - link
      - qrcode
  rss: /
  # rss:  /atom.xml #订阅
  # Article reading progress
  # 文章封面取色
  covercolor:
    enable: true
    # local: local color / api: api color / ave: oss average color
    mode: local
    # api address / api 地址
    api: https://api.qjqq.cn/api/Imgcolor?img=
    # Storage / 缓存时间
    time: 43200000
  footer:
    enable: true
    desc: # Articles from Ever Fu. / 文章来自 Ever Fu # description
    button: # Button
      enable: true
      name: 更多 # Learn more / 了解更多
      url: /guide/
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# 自定义主题颜色
theme_color:
  dark: "#ffc848" # dark
  light: "#425AEF" # light
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# display mode
# 显示模式
display_mode:
  # auto: automatic switching(Recognize the current theme mode of the device) / dark: dark mode / light: light mode
  # auto: 自动切换（识别设备当前主题模式） / dark: 深色模式 / light: 浅色模式
  type: auto
  # After opening, the dark mode will display the starry sky background
  # 开启后深色模式会显示星空背景
  universe: true
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Font
# 字体
font:
  font-size: 16px
  code-font-size: 16px
  # Global font
  # 全局字体
  font-family: "PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"
  # Code font
  # 代码字体
  code-font-family: '"monospace", monospace'
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Lure
# When the user exits the page, modify the title
# 当用户退出页面时，修改标题
lure:
  enable: true
  jump: 祝你好运 ！！！
  back: 欢迎回来 ！！！
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Article expiration
# 文章过期
expire:
  enable: true
  time: 30 # days
  position: top # top / bottom
  text_prev: "此文章已过期"
  text_next: "如果内容不匹配，请联系网站管理员进行更新。"
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Home page article configuration information
# 首页文章配置信息
index_post_list:
  direction: column # row / column
  column: 2 # 2: 2 columns 3: 3 columns
  cover: both
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Related articles
# 相关文章
related_post:
  enable: true
  limit: 2
  # created: release date / updated: update date
  # created: 发布日期 / updated: 更新日期
  date_type: created
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Custom right menu
# 自定义右键菜单
right_menu:
  enable: true
  # Whether to display the hot comment switch.
  # 是否显示热门评论开关
  commentBarrage: false
  # Whether to display the browser's context menu when hold Ctrl key.
  # 是否在按住 Ctrl 键时显示浏览器右键菜单
  ctrlOriginalMenu: true
  # Simplified and Traditional Chinese translation.
  # 简繁体转换
  translate: true
  # Custom list
  # 自定义列表
  custom_list:
    - name: 随机文章
      click: toRandomPost()
      id: menu-randomPost
      class:
      icon: fas fa-tower-broadcast
    - name: 全部分类
      click: pjax.loadUrl('/categories/') # External links with window.open, pjax can not request cross-domain content.
      id:
      class:
      icon: fas fa-clone
    - name: 全部标签
      click: pjax.loadUrl('/tags/')
      id:
      class:
      icon: fas fa-tags
# --------------------------- end -----------------------

# --------------------------- start ---------------------------
# Copy
#  information
# 复制信息
copy:
  enable: true
  # Turn on Link copyright information after copying.
  # 复制后链接版权信息
  copyright:
    enable: true
    # Display when the number of words copied exceeds
    # 复制文字时超过多少字数显示
    limit: 50
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Mermaid
mermaid: true
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Chart.js
chart: true
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# typeit
typeit: true
# --------------------------- end ---------------------------

### Extended configuration

# --------------------------- start ---------------------------
# Console
# 控制台
console:
  enable: true
  # Recent comments
  # 最新评论
  recentComment:
    enable: true
    # Cache time 1: 1 day / .5 : half a day
    # 缓存时间 1: 1天 / .5 : 半天
    storage: .2
  card:
    # Tags
    # 标签
    tags: true
    # Archives
    # 归档
    archive: "month" # month: by month / year: by year
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
translate:
  enable: true
  defaultEncoding: 2 # 1: 默认繁体 2: 默认简体
  translateDelay: 0 # 首次加载翻译迟疑时间
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Right-Sidebar
# 右下角悬停导航栏
rightside:
  enable: true
  percent: true
  hide:
    enable: true
    translate: true
    mode: true
    aside: true
# --------------------------- start ---------------------------

# --------------------------- start ---------------------------
# Footer
# 页脚
footer:
  # 社交图标
  information:
    author: true # img url / false
    left:
      Github: https://github.com/YiChena || fab fa-github # 名称: 链接 || 图标
      Mail: yichencv@163.com || far fa-envelope
    right:
      Bilibili: https://space.bilibili.com || fab fa-bilibili
      Douyin: https://v.douyin.com || fab fa-tiktok
  # 友情链接
  group:
    # 导航:
      导航: 
        公众号: /
      服务: 
        在线工具: /
      支持: 
        Hexo: https://hexo.io/zh-cn/
        Solitude 主题: https://github.com/everfu/hexo-theme-solitude
        致谢打赏: /links/
      协议: 
        免责声明: /Disclaimers/
        评论协议: /CommentAgreement/
        隐私协议: /PrivacyPolicy/
        版权协议: /CopyrightAgreement/
        Cookies: /Cookies/
  # 随机友链
  randomlink: true # 随机友链

  # 备案
  beian:
    - name: 湘公网安备 号
      url: https://beian.mps.gov.cn/#/query/webSearch
      icon: https://beian.mps.gov.cn/img/logo01.dd7ff50e.png
    - name: 湘ICP备 号
      url: https://beian.miit.gov.cn/
      icon: https://beian.miit.gov.cn/favicon.ico
  # 页脚信息文字
  links:
    - name: YIC
      url: /
    - name: License
      url: /
      icon:
        - fas fa-copyright
        - fab fa-creative-commons-by
        - fab fa-creative-commons-nc
        - fab fa-creative-commons-nd
    - name: boringbay
      url: /
      img: https://ydesign.oss-cn-beijing.aliyuncs.com/logo-003.png
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# 404 page
# 404 页面
errorpage:
  img: /img/404.avif
  text: =awa= Page Not Found # Text
  recommendList: true
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Meting API
# This part of the content uses metingjs,
# can only use NetEase Cloud Music, QQ Music and other music platforms supported by the mainland China region,
# the subsequent consideration of the use of JSON files to store music information and customize the implementation of the third-party API does not depend on the page.
# Music Page
meting_api: "https://meting.qjqq.cn/?server=:server&type=:type&id=:id&auth=:auth&r=:r" # Custom API
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Capsule music
# 音乐胶囊
capsule:
  enable: true
  # 歌单 ID / 单曲 ID
  id: 5144842535
  # 服务商：netease / qq / xiami / kugou / baidu
  server: netease
  # 类型：playlist / song
  type: playlist
  volume: 0.8
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Quick Menu
# Open with shift + ?
# 快捷菜单
# 使用 shift + ? 打开
keyboard:
  enable: true
  list:
    - name: 关闭快捷菜单
      key: K
      func: keyboard
    - name: 打开控制台
      key: A
      sco: showConsole
    - name: 播放/暂停音乐
      key: M
      sco: musicToggle
    - name: 打开友链
      key: L
      url: /links/
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Lazyload
# 懒加载
lazyload:
  enable: true
  field: site
  placeholder: ""
  errorimg: /img/error_load.avif
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Loading
# 加载
loading:
  # Full screen loading
  # 全屏加载
  fullpage: false
  # Loading icon, default is siteicon
  # 加载图标，不写默认siteicon
  favicon: https://ydesign.oss-cn-beijing.aliyuncs.com/logoIco.ico
  # Pace loading
  # Pace 加载
  pace: true
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Highlight
# 代码块高亮
highlight:
  enable: true
  # Display the fold button when the number of words exceeds
  # 当超过多少字时显示折叠按钮
  limit: 200
  # Whether to enable the copy button
  # 是否启用复制按钮
  copy: true
  # Whether to expand by default
  # 是否默认展开
  expand: true
  # default: default / mac : apple terminal
  # default: 默认 / mac : 苹果终端
  theme: mac
  # default / solidity / dracula
  color: default
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Lightbox
# 图片灯箱
lightbox: true
# warning: Please select any one, but cannot be turned on at the same time.
# 警告: 请任选其一，但不能同时开启。
fancybox: true # fancybox
mediumZoom: false # mediumZoom
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Memorial
# Turn the entire site gray on memorable days.
# 在纪念日整个网站变灰
memorial:
  enable: false
  date:
  #  - 7-7
  #  - 9-18
  #  - 12-13
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# OpenGraph
OpenGraph:
  enable: true
  options:
    # twitter_card:
    # twitter_image:
    # twitter_id:
    # twitter_site:
    # google_plus:
    # fb_admins:
    # fb_app_id:
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Word count
# 字数统计
# warning: Please install the hexo-wordcount plugin first.
# 警告: 请先安装 hexo-wordcount 插件。
wordcount: true # 设置文章字数统计为 true.
# totalCount: true # 设置站点文章总字数统计为 true.
# min2read: true # 阅读时长.
# readCount: true # 阅读次数.
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Katex
# Latex formula support
# Latex 公式支持
katex:
  enable: true
  # Whether to load on each page
  # 是否在每个页面加载
  per_page: true
  # Whether to enable copy formula
  # 是否启用复制公式
  copytex: true
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# verification
# 验证
verify_site:
  - name: google-site-verification
    content: xxxxxx
  - name: baidu-site-verification
    content: xxxxxxx
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Legacy CSS Prefix 
# CSS前缀配置
css_prefix: true
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Extend
# 扩展
extends:
  # Insert in head
  # 插入到 head
  head:
   - <script src="https://cdn.bootcdn.net/ajax/libs/pace/1.2.4/pace.min.js"></script>

  # Insert in body
  # 插入到 body
  body:
   - <script src="https://cdn.bootcdn.net/ajax/libs/pace/1.2.4/pace.min.js"></script>
   - <script charset="UTF-8" id="LA_COLLECT" src="//sdk.51.la/js-sdk-pro.min.js"></script>
   - <script>LA.init({id:"3O6mATrsTo1zcamR",ck:"3O6mATrsTo1zcamR"})</script>
   - <script id="LA-DATA-WIDGET" crossorigin="anonymous" charset="UTF-8" src="https://v6-widget.51.la/v6/3O6mATrsTo1zcamR/quote.js?theme=#F7F7F9,#333333,#999999,#333333,#F7F7F9,#1690FF,12&f=12&display=0,1,1,1,1,1,1,1"></script>
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# PWA
# Progressive Web App
pwa:
  enable: true
  manifest: /manifest.json # manifest.json
  theme_color: "#006a73" # Theme color
  mask_icon: https://ydesign.oss-cn-beijing.aliyuncs.com/logoIco.ico # Mask icon
  apple_touch_icon: https://ydesign.oss-cn-beijing.aliyuncs.com/logoIco.ico # Apple touch icon
  bookmark_icon: https://ydesign.oss-cn-beijing.aliyuncs.com/logoIco.ico # Bookmark icon
  favicon_32_32: https://ydesign.oss-cn-beijing.aliyuncs.com/logoIco.ico # 32x32 icon
  favicon_16_16: https://ydesign.oss-cn-beijing.aliyuncs.com/logoIco.ico # 16x16 icon

swpp:
  # 是否启用插件
  enable: false
  # 是否在发布前自动执行脚本
  # auto_exec: true

# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Comment
# 评论
comment:
  # Which commenting system to use(e.g. waline or waline,twikoo)
  # 使用哪个评论系统（例如： waline or waline,twikoo）
  use: twikoo # waline, twikoo, valine, artalk, giscus # Up to two comment systems can be turned on at the same time
  # Whether to display the hot comment switch.
  # 是否显示热门评论开关
  commentBarrage: false
  # Lazy load
  # 懒加载评论区
  lazyload: false
  # Whether to display the comment count
  # 显示评论数
  count: false
  # Sidebar displays the total number of comments
  # Sidebar 显示总评论数
  sidebar: false
  # PV
  pv: false
  # Avatar
  avatar: https://gravatar.com/avatar
  # Hot comment tips
  # 热评提示
  hot_tip:
    enable: false
    # Number of hot comments
    count: 3
  # recent comments(⚠️ Comments need to be configured first.)
  # 最新评论(⚠️ 需要先配置评论)
  newest_comment:
    enable: true
    storage: .5 # 缓存时间 1: 1天 / .5 : 半天 / Cache time 1: 1 day .5 : half a day
    limit: 5 # 评论数 / Number of comments
# Twikoo: https://solitude.js.org/configuration/comment/twikoo
twikoo: # https://twikoo.js.org/
  envId: https://twikoo-comment.holyfox.net/  # url: https://twikoo.sondy.top/
  region: # Environment locale, default is ap-shanghai, Tencent cloud environment fill ap-shanghai or ap-guangzhou; Vercel environment do not fill the.
  style: true # Use custom styles when turned on
  accessToken: # AccessToken
  option: # twikoo option
# Waline: https://solitude.js.org/configuration/comment/waline
waline: # https://waline.js.org/
  envId: # url: https://waline.wzsco.top
  pageview: false # Whether to enable page access statistics
  option: # waline configuration item
# Valine: https://solitude.js.org/configuration/comment/valine
valine:
  appId: # leancloud application app id
  appKey: # leancloud application app key
  serverURLs: # This configuration is suitable for domestic custom domain name users, overseas version will be automatically detected (no need to manually fill in)
  avatar: # https://valine.js.org/avatar.html
  visitor: false
  style: false # Use custom styles when turned on
  option: # options list
# Artalk: https://solitude.js.org/configuration/comment/artalk
artalk:
  server: # server url
  site: # site name
  option: # options
# Giscus: https://solitude.js.org/configuration/comment/giscus
giscus:
  repo: # GitHub repository name
  repo_id: # GitHub repository ID
  category_id: # GitHub repository category ID
  theme:
    light: light
    dark: dark
  option:
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Search
search:
  enable: true
  type: local  # local / algolia / docsearch
  tags:
    - Solitude
    - Hexo
  # Algolia
  algolia:
    hits:
      per_page: 6

  # Local search
  local:
    preload: false
    CDN: # url: search.xml

  # DocSearch
  # https://docsearch.algolia.com/
  docsearch:
    appId:
    apiKey:
    indexName:
    option:
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Music Page
# 音乐馆
music:
  enable: true
  # 歌单 ID / 单曲 ID
  # id: 5144842535
  id: 7731975278
  # 服务商：netease / qq / xiami / kugou / baidu
  server: netease
  # 类型：playlist / song
  type: playlist
  # 默认音量
  volume: 0.8
  # 是否自动播放
  mutex: true
  # 播放方式：list / random
  order: random
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Danmaku Page
# 弹幕留言页面
envelope:
  enable: true
  line: 10 # 显示行数
  speed: 20 # 播放速度
  hover: true # 鼠标悬停暂停
  loop: true # 循环播放
  page: /message/ # 留言板页面 / message board page
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Brevity Page
# 即刻短文
brevity:
  enable: true
  home_mini: true
  music: false
  page: /essay/
  style: 1
  strip: 30
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Recent comments Page
# 最近评论页面
recent_comments:
  enable: true
  limit: 50 # ⚠️waline 仅支持最大50条评论 / ⚠️waline only supports a maximum of 50 comments
  cache: 0.2 # 1 = 1天 / 1 = 1 day
  page: /recentcomments/ # 最近评论页面 / recent comments page
# --------------------------- end ---------------------------

# --------------------------- start ---------------------------
# Busuanzi
busuanzi: true
# 0: Original / 1: Custom
# 0: 原版 / 1: 自定义版
busuanzi_use: 0
# --------------------------- end ---------------------------

